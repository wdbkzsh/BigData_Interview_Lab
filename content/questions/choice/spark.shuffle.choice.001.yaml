content: 以下哪个操作一定会触发 Spark Shuffle？

options:
  - key: A
    text: map
  - key: B
    text: filter
  - key: C
    text: repartition
  - key: D
    text: mapPartitions

correct_answer: C

explanation: repartition 会重新分区，因此会触发 Shuffle。map、filter、mapPartitions 都是窄依赖，不会产生 Shuffle。
